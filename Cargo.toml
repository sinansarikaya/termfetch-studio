[package]
name = "termfetch-studio-v2"
default-run = "termfetch-studio"
version = "2.0.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
directories = "6.0.0"
image = "0.25.10"
jsonc-parser = "0.34.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-width = "0.2.2"

[[bin]]
name = "termfetch-studio"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

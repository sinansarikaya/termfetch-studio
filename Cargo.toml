[package]
name = "termfetch-studio-v2"
default-run = "termfetch-studio"
version = "2.1.0"
edition = "2024"
authors = ["Sinan Sarıkaya"]
description = "Cross-platform terminal customization and Fastfetch theme studio"
readme = "README.md"
repository = "https://github.com/sinansarikaya/termfetch-studio"
homepage = "https://termfetch-studio.sinansarikaya.dev"
license = "MIT"
keywords = ["fastfetch", "tui", "ratatui", "theme", "terminal"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.22"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
directories = "6.0.0"
image = "0.25.10"
jsonc-parser = { version = "0.34.0", features = ["serde"] }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-width = "0.2.2"

[[bin]]
name = "termfetch-studio"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Decoding the logo catalogue is slow in unoptimized builds (CI runners time out);
# only the image codecs are optimized, the rest of the app stays as is.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.zune-core]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3

[build-dependencies]
winresource = "0.1.34"

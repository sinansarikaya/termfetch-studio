map $uri $termfetch_studio_cache_control {
    default "no-cache";
    /healthz "no-store";
    ~^/assets/ "public, max-age=31536000, immutable";
    ~^/brand/ "public, max-age=86400";
    ~^/preset-logos/ "public, max-age=86400";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;

    add_header Cache-Control $termfetch_studio_cache_control;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_vary on;
    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "termfetch-studio-web ok\n";
    }
    location ~ /\. {
        return 404;
    }
    location ^~ /assets/ {
        try_files $uri =404;
    }
    location ^~ /brand/ {
        try_files $uri =404;
    }
    location ^~ /preset-logos/ {
        try_files $uri =404;
    }
    location ~* \.(?:js|css|svg|png|ico|icns|woff2?|json|xml|txt|webmanifest)$ {
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/index.html =404;
    }
}

name: Release Build & Distribution

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.0.0)'
        required: true
        default: 'v2.0.0'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 Glibc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_format: tar.gz
            binary: termfetch-studio
          # Linux x86_64 Musl (Static Universal)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive_format: tar.gz
            binary: termfetch-studio
            use_musl: true
          # macOS Apple Silicon (ARM64)
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_format: tar.gz
            binary: termfetch-studio
          # macOS Intel (x86_64)
          - os: macos-13
            target: x86_64-apple-darwin
            archive_format: tar.gz
            binary: termfetch-studio
          # Windows x64 MSVC
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_format: zip
            binary: termfetch-studio.exe

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Build Prerequisites (Linux Musl)
        if: matrix.use_musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build Binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Prepare Release Archive Directory
        shell: bash
        run: |
          TAG="${{ github.ref_name || github.event.inputs.tag }}"
          ARCHIVE_DIR="termfetch-studio-${TAG}-${{ matrix.target }}"
          mkdir -p "$ARCHIVE_DIR"
          
          # Copy Binary
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$ARCHIVE_DIR/"
          else
            cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$ARCHIVE_DIR/"
            strip "$ARCHIVE_DIR/${{ matrix.binary }}" || true
          fi

          # Copy Assets, License & Readme
          cp -r assets "$ARCHIVE_DIR/"
          cp LICENSE "$ARCHIVE_DIR/"
          cp README.md "$ARCHIVE_DIR/"

          # Create Archive
          if [ "${{ matrix.archive_format }}" = "zip" ]; then
            7z a "dist/${ARCHIVE_DIR}.zip" "$ARCHIVE_DIR"
          else
            mkdir -p dist
            tar -czf "dist/${ARCHIVE_DIR}.tar.gz" "$ARCHIVE_DIR"
          fi

      - name: Build Debian Package (Linux Glibc only)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          TAG="${{ github.ref_name || github.event.inputs.tag }}"
          VERSION="${TAG#v}"
          PKG_DIR="deb_build/termfetch-studio_${VERSION}_amd64"
          mkdir -p "$PKG_DIR/DEBIAN" "$PKG_DIR/usr/bin" "$PKG_DIR/usr/share/termfetch-studio"
          
          # Generate control file with real version
          sed "s/Version: .*/Version: $VERSION/" packaging/debian/control > "$PKG_DIR/DEBIAN/control"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$PKG_DIR/usr/bin/"
          cp -r assets "$PKG_DIR/usr/share/termfetch-studio/"
          
          dpkg-deb --build --root-owner-group "$PKG_DIR" "dist/termfetch-studio_${VERSION}_amd64.deb"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.target }}
          path: dist/*

  publish:
    name: Create GitHub Release & Checksums
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Generate Checksums
        working-directory: release_assets
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release_assets/*
          generate_release_notes: true

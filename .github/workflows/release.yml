name: Release Build & Distribution

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.0.0)'
        required: true
        default: 'v2.0.0'
      dry_run:
        description: 'Dry Run: Build archives and packages without publishing release'
        type: boolean
        required: true
        default: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 Glibc (+ Debian & RPM Packages)
          - name: linux-x86_64-gnu
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_format: tar.gz
            binary: termfetch-studio
            build_packages: true

          # Linux x86_64 Musl (Static Universal)
          - name: linux-x86_64-musl
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive_format: tar.gz
            binary: termfetch-studio
            use_musl: true

          # macOS Universal (Apple Silicon & Intel)
          - name: apple-darwin-universal
            os: macos-latest
            target: apple-darwin-universal
            archive_format: tar.gz
            binary: termfetch-studio
            is_macos_universal: true

          # Windows x64 MSVC
          - name: windows-x64-msvc
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_format: zip
            binary: termfetch-studio.exe

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain (Standard Targets)
        if: "!matrix.is_macos_universal"
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Rust Toolchain (macOS Universal Dual Targets)
        if: matrix.is_macos_universal
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install Build Prerequisites (Linux Musl)
        if: matrix.use_musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build Binary
        run: |
          if [ "${{ matrix.is_macos_universal }}" = "true" ]; then
            cargo build --release --locked --target aarch64-apple-darwin
            cargo build --release --locked --target x86_64-apple-darwin
            mkdir -p "target/${{ matrix.target }}/release"
            lipo -create -output "target/${{ matrix.target }}/release/${{ matrix.binary }}" \
              "target/aarch64-apple-darwin/release/${{ matrix.binary }}" \
              "target/x86_64-apple-darwin/release/${{ matrix.binary }}"
            echo "=== Verifying macOS Universal Mach-O Binary ==="
            lipo -info "target/${{ matrix.target }}/release/${{ matrix.binary }}"
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Prepare Release Archive Directory
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ inputs.tag || 'v2.0.0' }}"
          fi
          VERSION="${TAG#v}"
          ARCHIVE_DIR="termfetch-studio-${TAG}-${{ matrix.target }}"
          mkdir -p "$ARCHIVE_DIR" dist
          
          # Copy Binary & strip on unix
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$ARCHIVE_DIR/"
            # Windows users double-click install.cmd next to the exe.
            cp scripts/install.cmd scripts/install-windows.ps1 "$ARCHIVE_DIR/"
          else
            cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$ARCHIVE_DIR/"
            strip "$ARCHIVE_DIR/${{ matrix.binary }}" || true
          fi

          # Copy Assets, License & Readme
          cp -r assets "$ARCHIVE_DIR/"
          cp LICENSE "$ARCHIVE_DIR/"
          cp README.md "$ARCHIVE_DIR/"

          # Verify archive contents before packaging
          test -f "$ARCHIVE_DIR/${{ matrix.binary }}"
          test -d "$ARCHIVE_DIR/assets"
          test -s "$ARCHIVE_DIR/assets/brand/termfetch.ico"
          test -s "$ARCHIVE_DIR/assets/brand/termfetch.icns"
          test -s "$ARCHIVE_DIR/assets/brand/termfetch-symbol.svg"
          test -f "$ARCHIVE_DIR/LICENSE"
          test -f "$ARCHIVE_DIR/README.md"

          # Create Archive
          if [ "${{ matrix.archive_format }}" = "zip" ]; then
            7z a "dist/${ARCHIVE_DIR}.zip" "$ARCHIVE_DIR"
          else
            tar -czf "dist/${ARCHIVE_DIR}.tar.gz" "$ARCHIVE_DIR"
          fi

      - name: Build Debian and RPM Packages (Linux Glibc only)
        if: matrix.build_packages
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ inputs.tag || 'v2.0.0' }}"
          fi
          VERSION="${TAG#v}"
          ARCHIVE_DIR="termfetch-studio-${TAG}-${{ matrix.target }}"

          # 1. Build Debian (.deb)
          PKG_DIR="deb_build/termfetch-studio_${VERSION}_amd64"
          mkdir -p "$PKG_DIR/DEBIAN" "$PKG_DIR/usr/bin" "$PKG_DIR/usr/share/termfetch-studio"
          sed "s/Version: .*/Version: $VERSION/" packaging/debian/control > "$PKG_DIR/DEBIAN/control"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$PKG_DIR/usr/bin/"
          cp -r assets "$PKG_DIR/usr/share/termfetch-studio/"
          install -D -m 644 assets/brand/termfetch-symbol.svg "$PKG_DIR/usr/share/icons/hicolor/scalable/apps/termfetch-studio.svg"
          install -D -m 644 assets/brand/termfetch-studio.desktop "$PKG_DIR/usr/share/applications/termfetch-studio.desktop"
          dpkg-deb --build --root-owner-group "$PKG_DIR" "dist/termfetch-studio_${VERSION}_amd64.deb"

          # 2. Build RedHat/Fedora/openSUSE (.rpm)
          sudo apt-get update && sudo apt-get install -y rpm
          mkdir -p rpm_build/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cp "dist/${ARCHIVE_DIR}.tar.gz" "rpm_build/SOURCES/termfetch-studio-v${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          sed "s/^Version: .*/Version:        $VERSION/" packaging/rpm/termfetch-studio.spec > rpm_build/SPECS/termfetch-studio.spec
          rpmbuild -ba rpm_build/SPECS/termfetch-studio.spec --define "_topdir $(pwd)/rpm_build"
          cp rpm_build/RPMS/x86_64/*.rpm "dist/termfetch-studio-${VERSION}-1.x86_64.rpm"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.name }}
          path: dist/*

  publish:
    name: Create GitHub Release & Checksums
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Generate Checksums & Verify Archive Integrity
        working-directory: release_assets
        run: |
          echo "=== Built Artifacts in Release Package ==="
          ls -lh
          sha256sum * > SHA256SUMS.txt
          echo "=== SHA256SUMS.txt ==="
          cat SHA256SUMS.txt

      - name: Upload Distribution Package Artifact (For Dry Run & Audit)
        uses: actions/upload-artifact@v4
        with:
          name: release-distribution-package
          path: release_assets/*

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        if: "startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'false')"
        with:
          files: release_assets/*
          generate_release_notes: true

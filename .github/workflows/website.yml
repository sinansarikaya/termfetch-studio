name: Website
on:
  push:
    branches: [main, 'feat/**']
    paths: ['website/**', 'assets/brand/**', 'src/domain/**', 'src/adapters/fastfetch/config.rs', 'Cargo.toml', 'Dockerfile', '.dockerignore', 'deploy/**', '.github/workflows/website.yml']
  pull_request:
    paths: ['website/**', 'assets/brand/**', 'src/domain/**', 'src/adapters/fastfetch/config.rs', 'Cargo.toml', 'Dockerfile', '.dockerignore', 'deploy/**', '.github/workflows/website.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: termfetch-studio-website-${{ github.ref }}
  cancel-in-progress: true
jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci --prefix website
      - run: npm run lint --prefix website
      - run: npm run build --prefix website
      - run: npm audit --prefix website --audit-level=high
      - name: Build production container
        run: docker build -t termfetch-studio-web:ci .
      - name: Smoke test nonroot container
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name termfetch-studio-web-ci --read-only --tmpfs /tmp:rw,size=32m --cap-drop=ALL --security-opt=no-new-privileges -p 127.0.0.1:18080:8080 termfetch-studio-web:ci
          trap 'docker logs termfetch-studio-web-ci; docker rm -f termfetch-studio-web-ci' EXIT
          curl --retry 10 --retry-delay 1 --retry-connrefused --fail http://127.0.0.1:18080/healthz
          curl --fail http://127.0.0.1:18080/docs -o /dev/null
          test "$(docker inspect --format '{{.Config.User}}' termfetch-studio-web-ci)" = '101:101'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/assets/missing.js)" = '404'
